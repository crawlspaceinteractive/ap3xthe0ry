<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Micro+5&display=swap" rel="stylesheet">
  <style>
    :root {
      --face: #535353;
      --bg: #3a3a3a;
      --workspace: #252526;
      --titlebar: #535353;
      --text: #afafaf;
      --text-sel: #ffffff;
      --disabled: #8c8c8c;
      --btn: #464646;
      --btn-hot: #6b6b6b;
      --btn-sel: #212121;
      --list: #464646;
      --list-sel: #6b6b6b;
      --scrollbar-bg: #1f1f1f;
      --scrollbar-thumb: #464646;
      --border-light: #6b6b6b;
      --border-dark: #6b6b6b;
      --sep: #ffffff;
      --checkbox: #1f1f1f;
      --shadow: #000000;
      --bevel-hi: #8c8c8c;
      --bevel-lo: #1f1f1f;
      --bv: -1px 0 0 var(--bevel-hi), 0 -1px 0 var(--bevel-hi), 1px 0 0 var(--bevel-lo), 0 1px 0 var(--bevel-lo);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text); font-family: 'Micro 5', monospace;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      -webkit-font-smoothing: none; font-smooth: never;
      text-shadow: 1px 1px 0 #000;
    }
    .header {
      background: var(--titlebar); border-bottom: 3px solid var(--border-dark); box-shadow: 0 1px 0 var(--bevel-lo);
      padding: 6px 14px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 0 var(--shadow);
    }
    .header h1 { font-size: 34px; font-weight: bold; color: var(--text-sel); letter-spacing: 1px; text-transform: uppercase; }
    .header .status { font-size: 24px; color: var(--disabled); }
    .layout { display: grid; grid-template-columns: 1fr 420px; flex: 1; min-height: 0; }
    .tab-bar { display: flex; gap: 0; background: var(--bg); padding: 4px 4px 0 4px; flex-shrink: 0; }
    .tab {
      font-size: 24px; font-family: 'Micro 5', monospace;
      text-transform: uppercase; letter-spacing: 1px;
      padding: 6px 20px 4px; cursor: pointer;
      background: var(--bg); color: var(--disabled);
      border: 3px solid var(--border-dark); border-bottom: none;
      position: relative; top: 3px; border-radius: 0;
    }
    .tab::before, .tab::after {
      content: ''; position: absolute; width: 3px; height: 3px;
      background: var(--border-dark);
    }
    .tab::before { top: -3px; left: -3px; }
    .tab::after { top: -3px; right: -3px; }
    .tab.active {
      background: var(--face); color: var(--text-sel);
      z-index: 2;
      box-shadow: inset 0 -3px 0 var(--face), inset 0 2px 0 #fff;
    }
    .tab:not(.active) { box-shadow: inset 0 -3px 0 var(--bg); }
    .tab:hover:not(.active) { background: var(--btn); color: var(--text); }
    .tab-content { display: none; flex: 1; min-height: 0; position: relative; z-index: 0; }
    .tab-content.active { display: flex; flex-direction: column; min-height: 0; z-index: 1; }
    .tab-content.active::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: var(--bevel-hi); pointer-events: none; z-index: 10;
    }
    .tab-content.active::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
      background: var(--bevel-lo); pointer-events: none; z-index: 10;
    }
    .code-editor-wrap {
      flex: 1; min-height: 0; display: flex;
      border-right: 2px solid var(--border-dark); box-shadow: 1px 0 0 var(--bevel-lo);
    }
    #codeEditor {
      flex: 1; min-height: 0; width: 100%; resize: none;
      background: var(--workspace); color: var(--text-sel);
      font-family: 'Micro 5', monospace; font-size: 20px;
      border: none; outline: none; padding: 12px;
      -webkit-font-smoothing: none; font-smooth: never;
      text-shadow: 1px 1px 0 #000;
      line-height: 1.5; tab-size: 2;
    }
    #codeEditor::selection { background: var(--list-sel); color: var(--text-sel); }
    .code-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 10px; border-bottom: 1px solid var(--border-dark);
      cursor: pointer; font-size: 18px;
    }
    .code-item:hover { background: var(--list-sel); }
    .code-item.active { background: var(--list-sel); color: var(--text-sel); }
    .ci-label { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .code-item.active .ci-label { color: var(--text-sel); }
    .ci-src { color: var(--disabled); font-size: 14px; margin-left: 6px; flex-shrink: 0; }
    .vfs-group { border-left: 2px solid var(--border-dark); margin-left: 8px; }
    .vfs-group-title { font-size: 20px !important; padding: 4px 10px !important; background: var(--list) !important; }
    .viewport-wrap {
      display: flex; flex-direction: column;
      border-right: 2px solid var(--border-dark); box-shadow: 1px 0 0 var(--bevel-lo); min-height: 0;
      box-shadow: 4px 0 0 var(--shadow);
    }
    .viewport { flex: 1; position: relative; background: var(--workspace); min-height: 0; overflow: hidden; }
    .viewport canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    .viewport-label {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      font-size: 24px; color: var(--disabled); letter-spacing: 0.5px;
      text-transform: uppercase; pointer-events: none; z-index: 10;
      background: var(--workspace); padding: 3px 8px;
    }
    .palette {
      display: flex; flex-direction: column; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      background: var(--face);
      box-shadow: -4px 0 0 var(--shadow);
    }
    .palette-section { display: flex; flex-direction: column; }
    .palette-title {
      font-size: 26px; color: var(--text-sel); letter-spacing: 1px;
      text-transform: uppercase; padding: 8px 14px;
      border-bottom: 3px solid var(--border-dark); box-shadow: 0 1px 0 var(--bevel-lo), inset 0 2px 0 #000; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none; position: sticky; top: 0;
      background: var(--titlebar); z-index: 1;
    }
    .palette-title:hover { background: var(--btn-hot); }
    .palette-title .count { color: var(--disabled); font-size: 24px; }
    .palette-title::before {
      content: 'V'; font-size: 20px; margin-right: 6px;
      display: inline-block; transition: transform 0.15s;
    }
    .palette-section.collapsed .palette-title::before { transform: rotate(-90deg); }
    .palette-section.collapsed .palette-body { display: none; }
    .palette-body { overflow-y: auto; min-height: 0; background: var(--bg); }
    .palette::-webkit-scrollbar { width: 8px; }
    .palette::-webkit-scrollbar-track { background: var(--scrollbar-bg); }
    .palette::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); }
    .palette::-webkit-scrollbar-thumb:hover { background: var(--btn-hot); }
    .palette-body::-webkit-scrollbar { width: 8px; }
    .palette-body::-webkit-scrollbar-track { background: var(--scrollbar-bg); }
    .palette-body::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); }
    .palette-body::-webkit-scrollbar-thumb:hover { background: var(--btn-hot); }
    .gallery { display: flex; flex-direction: column; gap: 4px; padding: 8px; }
    .model-card {
      display: flex; align-items: center; gap: 10px; padding: 6px 8px;
      border: 3px solid var(--border-dark); box-shadow: var(--bv); background: var(--list);
      cursor: pointer; flex-shrink: 0;
    }
    .model-card:hover { background: var(--btn-hot); border-color: var(--border-light); }
    .model-card.active { background: var(--list-sel); border-color: var(--text-sel); }
    .mc-thumb {
      width: 56px; height: 56px; background: var(--workspace);
      border: 3px solid var(--border-dark); box-shadow: var(--bv); flex-shrink: 0;
      overflow: hidden; image-rendering: pixelated;
    }
    .mc-thumb canvas { width: 100%; height: 100%; display: block; }
    .mc-info { flex: 1; min-width: 0; }
    .mc-name {
      font-size: 26px; color: var(--text-sel); font-weight: bold;
      text-transform: uppercase; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .mc-meta { font-size: 20px; color: var(--disabled); }
    .texture-list { display: flex; flex-direction: column; gap: 4px; padding: 8px; }
    .texture-item {
      display: flex; align-items: center; gap: 10px; padding: 5px 8px;
      border: 3px solid var(--border-dark); box-shadow: var(--bv); background: var(--list);
      cursor: pointer; flex-shrink: 0;
    }
    .texture-item:hover { background: var(--btn-hot); border-color: var(--border-light); }
    .texture-item.active { background: var(--list-sel); border-color: var(--text-sel); }
    .tx-thumb {
      width: 36px; height: 36px; border: 3px solid var(--border-dark); box-shadow: var(--bv);
      image-rendering: pixelated; flex-shrink: 0; background: var(--workspace);
    }
    .tx-thumb canvas { width: 100%; height: 100%; display: block; }
    .tx-name { font-size: 24px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .controls-panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      padding: 6px 12px; background: var(--face);
      border-top: 3px solid var(--border-light); box-shadow: 0 -1px 0 var(--bevel-hi);
      display: flex; flex-direction: row; align-items: center; gap: 12px;
      box-shadow: 0 -4px 0 var(--shadow);
      overflow: hidden;
    }
    .ctrl { display: flex; flex-direction: row; align-items: center; gap: 4px; flex: 0 0 auto; }
    .ctrl label { font-size: 20px; color: var(--disabled); text-transform: uppercase; flex-shrink: 0; white-space: nowrap; }
    .ctrl .val { font-size: 26px; color: var(--text-sel); font-weight: bold; flex-shrink: 0; white-space: nowrap; }
    .ctrl input[type="range"] {
      width: 80px; height: 6px; cursor: pointer;
      -webkit-appearance: none; appearance: none;
      background: var(--scrollbar-bg); outline: none;
    }
    .ctrl input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 18px;
      background: var(--scrollbar-thumb); cursor: pointer; border: 3px solid var(--border-dark); box-shadow: var(--bv);
    }
    .ctrl-row { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .ctrl-row input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--checkbox); }
    .ctrl-row label { font-size: 24px; color: var(--text); cursor: pointer; white-space: nowrap; }
    .btn-row { display: flex; gap: 4px; flex: 0 0 auto; }
    .btn-row button { flex: none !important; padding: 4px 8px !important; gap: 4px !important; }
    .cam-hint {
      position: absolute; top: 9px; left: 9px; z-index: 15;
      font-size: 20px; color: var(--disabled); pointer-events: none;
      background: var(--workspace); padding: 3px 6px;
      box-shadow: 1px 1px 0 var(--shadow);
    }
    .tl-transport { display: flex; gap: 4px; flex-shrink: 0; }
    .tl-btn {
      background: var(--btn); border: 3px solid var(--border-dark); box-shadow: var(--bv);
      color: var(--text); padding: 0; margin: 0;
      cursor: pointer; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; position: relative;
    }
    .tl-btn .i {
      display: block; width: 1px; height: 1px;
      transform: scale(2); transform-origin: top left;
      position: absolute; top: 4px; left: 4px;
    }
    .tl-btn .i-play {
      background: #afafaf;
      box-shadow: 2px 0 0 #afafaf, 1px 1px 0 #afafaf, 2px 1px 0 #afafaf,
        0px 2px 0 #afafaf, 1px 2px 0 #afafaf, 2px 2px 0 #afafaf, 3px 2px 0 #afafaf,
        0px 3px 0 #afafaf, 1px 3px 0 #afafaf, 2px 3px 0 #afafaf, 3px 3px 0 #afafaf, 4px 3px 0 #afafaf,
        0px 4px 0 #afafaf, 1px 4px 0 #afafaf, 2px 4px 0 #afafaf, 3px 4px 0 #afafaf,
        0px 5px 0 #afafaf, 1px 5px 0 #afafaf, 2px 5px 0 #afafaf,
        0px 6px 0 #afafaf, 1px 6px 0 #afafaf;
    }
    .tl-btn .i-pause {
      background: #afafaf;
      box-shadow: 0 0 0 #afafaf, 3px 0 0 #afafaf,
        0px 1px 0 #afafaf, 3px 1px 0 #afafaf,
        0px 2px 0 #afafaf, 1px 2px 0 #afafaf, 2px 2px 0 #afafaf, 3px 2px 0 #afafaf,
        0px 3px 0 #afafaf, 1px 3px 0 #afafaf, 2px 3px 0 #afafaf, 3px 3px 0 #afafaf,
        0px 4px 0 #afafaf, 3px 4px 0 #afafaf,
        0px 5px 0 #afafaf, 3px 5px 0 #afafaf,
        0px 6px 0 #afafaf, 3px 6px 0 #afafaf;
    }
    .tl-btn .i-stop {
      background: #afafaf;
      box-shadow: 1px 0 0 #afafaf, 2px 0 0 #afafaf, 3px 0 0 #afafaf, 4px 0 0 #afafaf, 5px 0 0 #afafaf,
        0px 1px 0 #afafaf, 1px 1px 0 #afafaf, 2px 1px 0 #afafaf, 3px 1px 0 #afafaf, 4px 1px 0 #afafaf, 5px 1px 0 #afafaf,
        0px 2px 0 #afafaf, 1px 2px 0 #afafaf, 2px 2px 0 #afafaf, 3px 2px 0 #afafaf, 4px 2px 0 #afafaf, 5px 2px 0 #afafaf,
        0px 3px 0 #afafaf, 1px 3px 0 #afafaf, 2px 3px 0 #afafaf, 3px 3px 0 #afafaf, 4px 3px 0 #afafaf, 5px 3px 0 #afafaf,
        0px 4px 0 #afafaf, 1px 4px 0 #afafaf, 2px 4px 0 #afafaf, 3px 4px 0 #afafaf, 4px 4px 0 #afafaf, 5px 4px 0 #afafaf,
        0px 5px 0 #afafaf, 1px 5px 0 #afafaf, 2px 5px 0 #afafaf, 3px 5px 0 #afafaf, 4px 5px 0 #afafaf, 5px 5px 0 #afafaf;
    }
    .tl-btn .i-loop {
      background: #afafaf;
      box-shadow: 2px 0 0 #afafaf, 3px 0 0 #afafaf, 4px 0 0 #afafaf,
        1px 1px 0 #afafaf, 5px 1px 0 #afafaf,
        0px 2px 0 #afafaf, 5px 2px 0 #afafaf,
        0px 3px 0 #afafaf,
        0px 4px 0 #afafaf,
        1px 5px 0 #afafaf, 5px 5px 0 #afafaf,
        2px 6px 0 #afafaf, 3px 6px 0 #afafaf, 4px 6px 0 #afafaf;
    }
    .tl-btn.active { background: #3a3a5c; border-color: #8c8c8c; }
    .tl-scrub {
      flex: 1; height: 8px; -webkit-appearance: none; appearance: none;
      background: var(--scrollbar-bg); outline: none; cursor: pointer; min-width: 40px;
    }
    .tl-scrub::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 15px;
      background: var(--scrollbar-thumb); cursor: pointer; border: 3px solid var(--border-dark); box-shadow: var(--bv);
    }
    .tl-speed { width: 80px; flex: none; }
    button {
      flex: 1; background: var(--btn); min-width: 0;
      border: 3px solid var(--border-dark); box-shadow: var(--bv); color: var(--text);
      padding: 6px 10px; font-size: 24px;
      font-family: 'Micro 5', monospace; text-transform: uppercase;
      cursor: pointer; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    button:hover { background: var(--btn-hot); color: var(--text-sel); }
    button:active { background: var(--btn-sel); color: var(--text-sel); }
    .catalog-list { padding: 6px 14px; }
    .catalog-group { margin-bottom: 6px; }
    .catalog-group-title {
      font-size: 24px; color: var(--text); text-transform: uppercase;
      padding: 4px 0; border-bottom: 3px solid var(--border-dark); box-shadow: 0 1px 0 var(--bevel-lo);
      margin-bottom: 3px; cursor: pointer;
    }
    .catalog-group-title:hover { color: var(--text-sel); }
    .catalog-group-body { padding-left: 9px; }
    .catalog-row {
      font-size: 20px; color: var(--disabled); padding: 4px 0;
      display: flex; gap: 9px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .catalog-row .c-id { color: var(--text); min-width: 30px; text-align: right; }
    .catalog-row .c-name { color: var(--text); }
    .catalog-row .c-extra { color: var(--disabled); margin-left: auto; }
    #soundViz { padding: 6px 14px; display: none; flex-shrink: 0; }
    #soundViz.active { display: block; }
    #soundViz canvas {
      width: 100%; height: 48px; background: var(--workspace);
      border: 3px solid var(--border-dark); box-shadow: var(--bv); display: block;
    }
    #soundViz-label { font-size: 20px; color: var(--disabled); margin-top: 4px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>ASSET VIEWER</h1>
    <span class="status" id="statusText">Discovering modules...</span>
  </div>
  <div class="tab-bar">
    <div class="tab active" data-tab="visual">VISUAL</div>
    <div class="tab" data-tab="code">CODE</div>
  </div>
  <div class="tab-content active" id="tabVisual">
  <div class="layout">
    <div class="viewport-wrap">
      <div class="viewport" id="viewport">
        <canvas id="mainCanvas"></canvas>
        <canvas id="viewer2D" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; image-rendering: pixelated; z-index:5;"></canvas>
        <div class="viewport-label" id="viewportLabel"></div>
        <div class="cam-hint" id="camHint">LMB orbit / RMB pan / scroll zoom</div>
        <div id="soundViz">
          <canvas id="soundVizCanvas"></canvas>
          <div id="soundViz-label">waveform</div>
        </div>
        <div class="controls-panel">
          <div class="ctrl"><label>SCALE</label><input type="range" id="scaleSlider" min="0.2" max="5" step="0.1" value="1"><span class="val" id="scaleVal">1.0x</span></div>
          <div class="tl-transport">
            <button class="tl-btn" id="tlPlay" title="Play/Pause"><span class="i i-play"></span></button>
            <button class="tl-btn" id="tlStop" title="Stop"><span class="i i-stop"></span></button>
            <button class="tl-btn active" id="tlLoop" title="Loop"><span class="i i-loop"></span></button>
          </div>
          <input type="range" class="tl-scrub" id="tlScrub" min="0" max="1000" step="1" value="0">
          <span class="val" id="tlTime">0.00s</span>
          <div class="ctrl"><label>SPEED</label><input type="range" class="tl-speed" id="tlSpeed" min="0.1" max="3" step="0.1" value="1"><span class="val" id="tlSpeedVal">1.0x</span></div>
          <div class="btn-row"><button id="resetView">RESET</button></div>
        </div>
      </div>
    </div>
    <div class="palette">
      <div class="palette-section" id="modelsSection" style="display:none;">
        <div class="palette-title">MODELS <span class="count" id="modelCount"></span></div>
        <div class="palette-body"><div class="gallery" id="gallery"></div></div>
      </div>
      <div class="palette-section" id="texturesSection" style="display:none;">
        <div class="palette-title">TEXTURES <span class="count" id="textureCount"></span></div>
        <div class="palette-body"><div class="texture-list" id="textureList"></div></div>
      </div>
      <div class="palette-section" id="spritesSection" style="display:none;">
        <div class="palette-title">SPRITES <span class="count" id="spriteCount"></span></div>
        <div class="palette-body"><div class="texture-list" id="spriteList"></div></div>
      </div>
      <div class="palette-section" id="scenesSection" style="display:none;">
        <div class="palette-title">SCENES <span class="count" id="sceneCount"></span></div>
        <div class="palette-body"><div class="texture-list" id="sceneList"></div></div>
      </div>
      <div class="palette-section" id="effectsSection" style="display:none;">
        <div class="palette-title">EFFECTS <span class="count" id="effectCount"></span></div>
        <div class="palette-body"><div class="texture-list" id="effectList"></div></div>
      </div>
      <div class="palette-section" id="catalogSection" style="display:none;">
        <div class="palette-title">DATA CATALOG <span class="count" id="catalogCount"></span></div>
        <div class="palette-body"><div class="catalog-list" id="catalogList"></div></div>
      </div>
    </div>
  </div>
  </div>
  <div class="tab-content" id="tabCode">
    <div class="layout">
      <div class="code-editor-wrap">
        <textarea id="codeEditor" spellcheck="false" placeholder="// select a module from the palette to view its source..."></textarea>
      </div>
      <div class="palette" id="paletteCode"></div>
    </div>
  </div>
  <script>
    // ===== CONFIGURATION =====
    // Override via query param: ?root=./modules or ?root=./src/game
    // If not set, auto-discovers by scanning the server root.
    const urlParams = new URLSearchParams(window.location.search);
    const queryRoot = urlParams.get('root');

    // ===== STATE =====
    let loadedModels = {};
    let loadedTextures = {};
    let loadedSprites = {};
    let loadedEffects = {};
    let loadedScenes = {};
    let moduleSources = {};
    let loadedNames = [];
    let currentModelName = null;
    let selectedTextureKey = null;
    let viewMode = 'none';
    let current2D = null; // { drawFn, isObstacle, name, entity, look, texture }
    let catalogData = {};
    let texGenSource = '';
    let vfsModuleOrder = [];
    let lastRendererMethodName = null;

    // ===== THREE.JS =====
    let mainScene, mainCamera, mainRenderer, mainModelGroup, mainOrbit;
    const baseZoom = 1.5;

    function initMainViewport() {
      const canvas = document.getElementById('mainCanvas');
      const container = document.getElementById('viewport');
      if (!canvas || !container) return;
      mainScene = new THREE.Scene();
      mainScene.background = new THREE.Color(0x1a1a1a);
      mainCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
      mainCamera.position.set(0, 0.5, baseZoom);
      mainCamera.lookAt(0, 0.3, 0);
      mainRenderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      mainRenderer.setPixelRatio(window.devicePixelRatio);
      mainScene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const dl = new THREE.DirectionalLight(0xffffff, 0.6);
      dl.position.set(1, 1.5, 1);
      mainScene.add(dl);
      mainModelGroup = new THREE.Group();
      mainScene.add(mainModelGroup);
      if (THREE.OrbitControls) {
        mainOrbit = new THREE.OrbitControls(mainCamera, canvas);
        mainOrbit.enableDamping = true;
        mainOrbit.dampingFactor = 0.12;
        mainOrbit.target.set(0, 0.3, 0);
        mainOrbit.minDistance = 0.3;
        mainOrbit.maxDistance = 8;
      }
      function resize() {
        const w = container.clientWidth, h = container.clientHeight;
        if (w === 0 || h === 0) return;
        mainCamera.aspect = w / h;
        mainCamera.updateProjectionMatrix();
        mainRenderer.setSize(w, h);
      }
      resize();
      window.addEventListener('resize', () => { resize(); if (viewMode === 'sprite' || viewMode === 'scene' || viewMode === 'texture') renderCurrent2D(); });
    }

    function animate() {
      requestAnimationFrame(animate);
      if (mainOrbit) mainOrbit.update();
      if (mainRenderer && mainScene && mainCamera) {
        mainRenderer.render(mainScene, mainCamera);
      }
    }

    function resetView() {
      document.getElementById('mainCanvas').style.display = 'block';
      document.getElementById('viewer2D').style.display = 'none';
      mainCamera.position.set(0, 0.5, baseZoom);
      mainCamera.lookAt(0, 0.3, 0);
      if (mainOrbit) { mainOrbit.target.set(0, 0.3, 0); mainOrbit.update(); }
      document.getElementById('scaleSlider').value = 1;
      document.getElementById('scaleVal').textContent = '1.0x';
    }

    function createMaterials() {
      return {
        M: (color) => new THREE.MeshPhongMaterial({ color }),
        MB: (color) => new THREE.MeshPhongMaterial({ color, emissive: 0x222222 }),
      };
    }

    function createBoxFunction() {
      return (w, h, d, color) => {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mat = new THREE.MeshPhongMaterial({ color });
        return new THREE.Mesh(geo, mat);
      };
    }

    function renderThumbToCanvas(modelData, canvas) {
      const thumbScene = new THREE.Scene();
      thumbScene.background = new THREE.Color(0x1a1a1a);
      thumbScene.add(new THREE.AmbientLight(0xffffff, 0.9));
      const dl = new THREE.DirectionalLight(0xffffff, 0.5);
      dl.position.set(1, 1.5, 1);
      thumbScene.add(dl);
      if (modelData.grp) thumbScene.add(modelData.grp);
      const thumbCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      thumbCamera.position.set(0, 0.4, 1.2);
      thumbCamera.lookAt(0, 0.3, 0);
      const thumbRenderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true });
      thumbRenderer.setPixelRatio(1);
      thumbRenderer.setSize(56, 56);
      thumbRenderer.render(thumbScene, thumbCamera);
      thumbRenderer.dispose();
    }

    function abgrToCSS(c) {
      if (c == null || typeof c !== 'number') return '#888';
      const r = c & 0xff;
      const g = (c >>> 8) & 0xff;
      const b = (c >>> 16) & 0xff;
      const a = (c >>> 24) & 0xff;
      if (a < 255) return 'rgba(' + r + ',' + g + ',' + b + ',' + (a / 255).toFixed(2) + ')';
      return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
    }

    function renderTrisToCanvas(tris, canvas, bgColor) {
      if (!tris || tris.length === 0) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      const W = canvas.width, H = canvas.height;
      ctx.fillStyle = bgColor || '#1a1a1a';
      ctx.fillRect(0, 0, W, H);
      const sorted = tris.slice().sort((a, b) => (b.avgZ || 0) - (a.avgZ || 0));
      for (const tri of sorted) {
        if (!tri.verts || tri.verts.length < 3) continue;
        const v = tri.verts;
        const minX = Math.min(v[0].sx, v[1].sx, v[2].sx);
        const maxX = Math.max(v[0].sx, v[1].sx, v[2].sx);
        const minY = Math.min(v[0].sy, v[1].sy, v[2].sy);
        const maxY = Math.max(v[0].sy, v[1].sy, v[2].sy);
        if (maxX < 0 || minX > W || maxY < 0 || minY > H) continue;
        ctx.fillStyle = abgrToCSS(tri.color);
        ctx.beginPath();
        ctx.moveTo(v[0].sx, v[0].sy);
        ctx.lineTo(v[1].sx, v[1].sy);
        ctx.lineTo(v[2].sx, v[2].sy);
        ctx.closePath();
        ctx.fill();
      }
    }

    function trisToThreeGroup(tris) {
      const group = new THREE.Group();
      if (!tris || tris.length === 0) return group;
      const sorted = tris.slice().sort((a, b) => (b.avgZ || 0) - (a.avgZ || 0));
      for (const tri of sorted) {
        if (!tri.verts || tri.verts.length < 3) continue;
        const verts = tri.verts;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(9);
        for (let i = 0; i < 3; i++) {
          positions[i * 3] = verts[i].sx * 0.006;
          positions[i * 3 + 1] = -verts[i].sy * 0.006;
          positions[i * 3 + 2] = -(verts[i].cz || 0) * 0.01;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.computeVertexNormals();
        const c = tri.color;
        const r = (c & 0xff) / 255;
        const g = ((c >>> 8) & 0xff) / 255;
        const b = ((c >>> 16) & 0xff) / 255;
        const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b), side: THREE.DoubleSide });
        group.add(new THREE.Mesh(geo, mat));
      }
      return group;
    }

    // ===== MODULE LOADING =====
    async function loadJSFile(filename, code) {
      const errors = [];
      if (/^\s*#!\s*\//.test(code)) return errors;
      try {
        const mod = { exports: {} };
        const THREE_ref = THREE;
        let cleanCode = code
          .replace(/import\s+\*\s+as\s+THREE\s+from\s+['"]three['"]/g, '')
          .replace(/import\s+\*\s+as\s+(\w+)\s+from\s+['"]three['"]/g, 'const $1 = THREE')
          .replace(/import\s+(\w+)\s*,\s*\{\s*([^}]+)\s*\}\s+from\s+['"][^'"]*['"]/g, (m, defName, names) => {
            let r = 'const ' + defName + ' = importCache[' + JSON.stringify(defName) + '];\n';
            r += names.split(',').map(n => n.trim()).filter(n => n.length > 0).map(n => {
              const parts = n.split(/\s+as\s+/);
              return 'const ' + (parts[1] || parts[0]).trim() + ' = importCache[' + JSON.stringify(parts[0].trim()) + '];';
            }).join('\n');
            return r;
          })
          .replace(/import\s+\{\s*([^}]+)\s*\}\s+from\s+['"][^'"]*['"]/g, (m, names) => {
            return names.split(',').map(n => n.trim()).filter(n => n.length > 0).map(n => {
              const parts = n.split(/\s+as\s+/);
              const imported = parts[0].trim();
              const local = (parts[1] || parts[0]).trim();
              // Stub missing named imports so entry modules (main.js + SDK) don't throw before detection
              return 'const ' + local + ' = importCache[' + JSON.stringify(imported) + '] ?? (() => ({}));';
            }).join('\n');
          })
          .replace(/import\s+\*\s+as\s+(\w+)\s+from\s+['"][^'"]*['"]/g, 'const $1 = importCache')
          .replace(/import\s+(\w+)\s+from\s+['"][^'"]*['"]/g, (m, name) =>
            'const ' + name + ' = importCache[' + JSON.stringify(name) + '] || (() => {})')
          .replace(/import\s+['"][^'"]*['"];?\s*\n?/g, '')
          .replace(/export\s+default\s+class\s+(\w+)/g, 'class $1')
          .replace(/export\s+default\s+(?=function\s|const\s|let\s|var\s|class\s|\(|async\s)/g, '')
          .replace(/export\s+default\s+(\w[\w.]*)\s*;?\s*$/gm, 'module.exports.default = $1;')
          .replace(/export\s+\{\s*([^}]+)\s*\}\s*;?\s*$/gm, (m, names) => {
            return names.split(',').map(n => n.trim()).filter(n => n.length > 0).map(n => {
              const parts = n.split(/\s+as\s+/);
              const local = parts[0].trim();
              const exported = (parts[1] || parts[0]).trim();
              return 'module.exports[' + JSON.stringify(exported) + '] = ' + local + ';';
            }).join('\n');
          })
          .replace(/export\s+/g, '');
        const exportMatches = [...code.matchAll(/export\s+(?:default\s+)?(?:function|const|let|var|class)\s+(\w+)/g)];
        const exportedNames = exportMatches.map(m => m[1]);
        if (exportedNames.length > 0) {
          cleanCode += '\n// Auto-exported:\n';
          exportedNames.forEach(name => {
            cleanCode += 'if (typeof ' + name + ' !== "undefined") module.exports.' + name + ' = ' + name + ';\n';
          });
        }
        const importCache = window.importCache || {};
        window.importCache = importCache;
        const fn = new Function('THREE', 'module', 'exports', 'window', 'importCache', cleanCode);
        fn(THREE_ref, mod, mod.exports, window, importCache);
        const exports = mod.exports;
        for (const key of Object.keys(exports)) {
          if (key === 'module' || key === 'exports') continue;
          importCache[key] = exports[key];
          if (key === 'default') {
            importCache[filename.replace('.js', '')] = exports[key];
          } else {
            importCache[filename.replace('.js', '') + ':' + key] = exports[key];
          }
        }
        console.log('[' + filename + '] Exported:', Object.keys(exports).join(', '));

        // --- Auto-detect 3D model builders ---
        for (const key of Object.keys(exports)) {
          if (typeof exports[key] !== 'function') continue;
          const fname = key.toLowerCase();
          const isBuilder = fname.includes('build');
          if (!isBuilder) continue;

          // Try 1: THREE.js builder pattern (returns { grp })
          let detected = false;
          if (Object.keys(loadedModels).length === 0 || !detected) {
            try {
              const testResult = exports[key]('default', { M: createMaterials().M, MB: createMaterials().MB, box: createBoxFunction() });
              if (testResult && testResult.grp) {
                const configs = [];
                if (testResult.config) {
                  configs.push(...(Array.isArray(testResult.config) ? testResult.config : [testResult.config]));
                } else {
                  configs.push({ type: 'default', category: 'model' });
                }
                loadedModels[filename] = { builder: exports[key], config: configs, name: filename.replace('.js', ''), mode: 'three' };
                populateGallery(configs, filename);
                detected = true;
              }
            } catch (e) { /* not THREE.js builder */ }
          }

          // Try 2: Software renderer pattern (returns Array<{ verts, color, avgZ }>)
          if (!detected) {
            const MOCK_CAM = { x: 0, y: 3, z: -8, yaw: 0, pitch: 0, fovMul: 1 };
            const argPatterns = [
              [0, 0, 0, 1, MOCK_CAM],
              [0, 0, 0, 1, 0, MOCK_CAM],
              [0, 0, 0, 1, 'default', MOCK_CAM],
              [0, 0, 0, 1, 1, 0xff8888ff, MOCK_CAM],
            ];
            for (const args of argPatterns) {
              try {
                const result = exports[key](...args);
                if (Array.isArray(result) && result.length > 0 && result[0] && result[0].verts) {
                  const cfg = { type: key, category: 'software-tri', tris: result, fnName: key };
                  loadedModels[filename + ':' + key] = { builder: exports[key], config: [cfg], name: key, source: filename, mode: 'tri', fnName: key };
                  populateGallery([cfg], filename + ':' + key);
                  detected = true;
                  break;
                }
              } catch (e) { /* wrong arg pattern */ }
            }
          }
        }

        // --- Auto-detect textures (functions returning canvas) ---
        for (const key of Object.keys(exports)) {
          if (typeof exports[key] !== 'function') continue;
          if (exports[key].length === 0) {
            try {
              const result = exports[key]();
              if (result && result.tagName === 'CANVAS') {
                loadedTextures[filename.replace('.js', '') + ':' + key] = { image: result, source: filename + '.' + key };
                populateTextureList(loadedTextures);
              }
            } catch (e) { /* not a texture generator */ }
          } else if (exports[key].length === 1) {
            const tryArgs = ['default', 'basic', 'normal', 'main', '0', 0];
            for (const arg of tryArgs) {
              try {
                const result = exports[key](arg);
                if (result && result.tagName === 'CANVAS') {
                  loadedTextures[filename.replace('.js', '') + ':' + key + '_' + arg] = { image: result, source: filename + '.' + key + '(' + arg + ')' };
                  populateTextureList(loadedTextures);
                } else break;
              } catch (e2) { break; }
            }
          }
        }

        // --- Auto-detect sprite drawers (objects with sprite/draw methods taking ctx) ---
        const DRAW_PARAM = /^(ctx|c|context|canvas|g|gfx|gc|rd|renderCtx|renderContext|drawCtx)$/;
        for (const key of Object.keys(exports)) {
          const val = exports[key];
          if (typeof val !== 'object' || val === null) continue;
          const keys = Object.keys(val);
          if (keys.length === 0) continue;
          let isSpriteSet = false;
          let isFlatDrawerSet = false;
          for (const k of keys.slice(0, 12)) {
            if (typeof val[k] === 'object' && val[k] !== null) {
              if (typeof val[k].sprite === 'function' || typeof val[k].draw === 'function') {
                isSpriteSet = true;
                break;
              }
            } else if (typeof val[k] === 'function' && val[k].length >= 2) {
              const fnStr = val[k].toString();
              const sigMatch = fnStr.match(/\((\w+)/);
              const fp = sigMatch ? sigMatch[1] : '';
              if (DRAW_PARAM.test(fp)) {
                isFlatDrawerSet = true;
              }
            }
          }
          if (isSpriteSet) {
            const firstKey = keys.find(k => typeof val[k] === 'object' && val[k] !== null && (typeof val[k].sprite === 'function' || typeof val[k].draw === 'function'));
            const firstEntry = firstKey ? val[firstKey] : null;
            const isObstacle = firstEntry && typeof firstEntry.sprite === 'function' && firstEntry.sprite.length >= 4;
            loadedSprites[filename.replace('.js', '') + ':' + key] = { drawers: val, name: key, source: filename, isObstacle };
            populateSpriteList();
          } else if (isFlatDrawerSet) {
            const wrapped = {};
            for (const k of keys) {
              if (typeof val[k] === 'function') {
                wrapped[k] = { sprite: val[k] };
              }
            }
            loadedSprites[filename.replace('.js', '') + ':' + key] = { drawers: wrapped, name: key, source: filename, isObstacle: true };
            populateSpriteList();
          }
        }

        // --- Auto-detect standalone draw functions ---
        for (const key of Object.keys(exports)) {
          if (typeof exports[key] !== 'function') continue;
          const fnStr = exports[key].toString();
          if (fnStr.startsWith('class')) continue;
          if (exports[key].length < 2) continue;
          const sigMatch = fnStr.match(/\((\w+)/);
          const firstParam = sigMatch ? sigMatch[1] : '';
          if (DRAW_PARAM.test(firstParam)) {
            const sigMatch = fnStr.match(/\(([^)]*)\)/);
            const paramList = sigMatch ? sigMatch[1].split(',').map(p => p.trim().split('=')[0].trim()).filter(p => p.length > 0) : [];
            loadedSprites[filename.replace('.js', '') + ':' + key] = { drawers: { default: { sprite: exports[key] } }, name: key, source: filename, _paramList: paramList.length > 0 ? paramList : null };
            populateSpriteList();
            if (paramList.length >= 3) {
              const secondParam = paramList[1];
              if (typeof exports[key](null, 0) === 'object') {
                try {
                  for (let ti = 0; ti < 16; ti++) {
                    const c = document.createElement('canvas');
                    c.width = 32; c.height = 32;
                    const tctx = c.getContext('2d');
                    exports[key](tctx, ti, 0, 0, 32, ti, 0, 0.5, null);
                    loadedTextures[filename.replace('.js', '') + ':tile_' + ti] = { image: c, name: 'tile_' + ti, source: filename };
                  }
                  populateTextureList(loadedTextures);
                } catch (e) {}
              }
            }
          } else if (exports[key].length >= 1 && !fnStr.startsWith('class')) {
            loadedEffects[filename.replace('.js', '') + ':' + key] = { drawFn: exports[key], name: key, source: filename };
            populateEffectsList();
          }
        }

        // --- Diagnostic: log what was NOT detected ---
        const detectedKeys = new Set();
        for (const k of Object.keys(loadedSprites)) if (k.startsWith(filename.replace('.js', ''))) detectedKeys.add(k.split(':')[1]);
        for (const k of Object.keys(loadedEffects)) if (k.startsWith(filename.replace('.js', ''))) detectedKeys.add(k.split(':')[1]);
        for (const k of Object.keys(loadedTextures)) if (k.startsWith(filename.replace('.js', ''))) detectedKeys.add(k.split(':')[1]);
        const allExportKeys = Object.keys(exports).filter(k => k !== 'module' && k !== 'exports');
        const missed = allExportKeys.filter(k => !detectedKeys.has(k));
        if (missed.length > 0) {
          const missedTypes = missed.map(k => {
            const v = exports[k];
            if (typeof v === 'function') return v.toString().startsWith('class') ? `class ${k}` : `fn(${v.length}) ${k}`;
            if (typeof v === 'object' && v !== null) {
              const objKeys = Object.keys(v).slice(0, 5);
              return `obj{${objKeys.join(',')}} ${k}`;
            }
            return `${typeof v} ${k}`;
          });
          console.log('[undetected]', filename, ':', missedTypes.join(' | '));
        }

        // --- Auto-detect data catalogs ---
        const skipExports = new Set(['module', 'exports', 'THREE', 'window', 'document']);
        for (const key of Object.keys(exports)) {
          if (skipExports.has(key)) continue;
          const val = exports[key];
          if (typeof val === 'function') continue;
          if ((typeof val === 'object' && val !== null) || typeof val === 'number' || typeof val === 'string') {
            const id = filename.replace('.js', '') + ':' + key;
            addCatalog(id, filename.replace('.js', '') + ' / ' + key, val);
          }
        }
      } catch (e) {
        console.error('Error loading ' + filename + ':', e);
        errors.push(filename + ': ' + e.message);
      }
      return errors;
    }

    // ===== MODULE DISCOVERY =====
    async function discoverModules() {
      // 1. Try modules.json in same directory
      try {
        const resp = await fetch('modules.json');
        if (resp.ok) {
          const list = await resp.json();
          if (Array.isArray(list) && list.length > 0) return { root: '', modules: list };
        }
      } catch (e) {}

      // 2. If root query param set, use it directly
      if (queryRoot) {
        const root = queryRoot.replace(/\/?$/, '/');
        try {
          const resp = await fetch(root);
          if (resp.ok) {
            const html = await resp.text();
            const files = parseDirJS(html);
            if (files.length > 0) return { root, modules: files };
          }
        } catch (e) {}
        return { root, modules: [] };
      }

      // 3. Auto-scan server root for directories containing .js files
      for (const basePath of ['/', './']) {
        try {
          const resp = await fetch(basePath);
          if (!resp.ok) continue;
          const html = await resp.text();
          const dirs = parseDirDirs(html);

          // Check if root itself has .js files
          const rootFiles = parseDirJS(html);
          if (rootFiles.length > 0) return { root: basePath, modules: rootFiles };

          // Check each subdirectory for .js files
          for (const dir of dirs) {
            try {
              const subResp = await fetch(basePath + dir);
              if (!subResp.ok) continue;
              const subHtml = await subResp.text();
              const subFiles = parseDirJS(subHtml);
              if (subFiles.length > 0) return { root: basePath + dir, modules: subFiles };
            } catch (e2) {}
          }
        } catch (e) {}
      }

      return { root: './', modules: [] };
    }

    function parseDirLinks(html) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const links = doc.querySelectorAll('a[href]');
      const files = [], dirs = [];
      links.forEach(a => {
        const href = a.getAttribute('href');
        if (!href || href.startsWith('..') || href.startsWith('http') || href.startsWith('?')) return;
        const clean = href.replace(/\/$/, '');
        if (clean.includes('/')) return;
        if (href.endsWith('/')) dirs.push(clean);
        else if (clean.endsWith('.js')) files.push(clean);
      });
      return { files: files.sort(), dirs: dirs.sort() };
    }
    function parseDirJS(html) { return parseDirLinks(html).files; }
    function parseDirDirs(html) { return parseDirLinks(html).dirs; }

    async function autoPreload() {
      const status = document.getElementById('statusText');
      const { root, modules } = await discoverModules();
      const MODULE_ROOT = root;

      if (modules.length === 0) {
        status.textContent = 'No modules found (run scan-modules.js or enable directory listing)';
        return;
      }

      const SKIP_PREFIXES = ['tools/', 'node_modules/', '__', '.'];
      const filtered = modules.filter(name => !SKIP_PREFIXES.some(p => name.startsWith(p)));

      // Phase 1: fetch all source code
      status.textContent = 'Fetching modules...';
      moduleSources = {};
      for (const name of filtered) {
        try {
          const resp = await fetch(MODULE_ROOT + name + '?v=' + Date.now());
          if (resp.ok) moduleSources[name] = await resp.text();
        } catch (e) {}
      }
      loadedNames = Object.keys(moduleSources);
      if (loadedNames.length === 0) { status.textContent = 'Ready'; return; }

      // Phase 2: first pass — execute all modules to populate importCache
      status.textContent = 'Loading pass 1...';
      for (const name of loadedNames) {
        try {
          const errs = await loadJSFile(name, moduleSources[name]);
          if (!vfsModuleOrder.includes(name)) vfsModuleOrder.push(name);
        } catch (e) { console.warn('[pass1]', name, e); }
      }

      // Phase 3: second pass — re-execute all modules so late-binding imports resolve
      status.textContent = 'Resolving imports...';
      loadedSprites = {};
      loadedTextures = {};
      loadedEffects = {};
      loadedScenes = {};
      loadedModels = {};
      document.getElementById('spriteList').innerHTML = '';
      document.getElementById('textureList').innerHTML = '';
      document.getElementById('effectList').innerHTML = '';
      document.getElementById('sceneList').innerHTML = '';
      document.getElementById('gallery').innerHTML = '';
      document.getElementById('spritesSection').style.display = 'none';
      document.getElementById('texturesSection').style.display = 'none';
      document.getElementById('effectsSection').style.display = 'none';
      document.getElementById('scenesSection').style.display = 'none';
      document.getElementById('modelsSection').style.display = 'none';
      document.getElementById('catalogList').innerHTML = '';
      document.getElementById('catalogSection').style.display = 'none';
      modelTotal = 0;
      addedModelIds.clear();
      catalogData = {};

      for (const name of loadedNames) {
        try {
          const errs = await loadJSFile(name, moduleSources[name]);
          if (!vfsModuleOrder.includes(name)) vfsModuleOrder.push(name);
        } catch (e) { console.warn('[pass2]', name, e); }
      }

      // Phase 4: extract inline & standalone draw functions from all loaded modules
      for (const [modName, modSrc] of Object.entries(moduleSources)) {
        extractInlineDrawers(modSrc, modName);
      }

      // Phase 5: extract draw methods from exported classes
      extractClassDrawers();

      const spriteSummary = {};
      for (const [k, v] of Object.entries(loadedSprites)) {
        const src = v.source || 'unknown';
        spriteSummary[src] = (spriteSummary[src] || 0) + 1;
      }
      console.log('[sprites] Total:', Object.keys(loadedSprites).length, '| By source:', spriteSummary);
      const sceneSummary = {};
      for (const [k, v] of Object.entries(loadedScenes)) {
        const src = v.source || 'unknown';
        sceneSummary[src] = (sceneSummary[src] || 0) + 1;
      }
      if (Object.keys(loadedScenes).length > 0) console.log('[scenes] Total:', Object.keys(loadedScenes).length, '| By source:', sceneSummary);
      const effectSummary = {};
      for (const [k, v] of Object.entries(loadedEffects)) {

    async function populateGallery(config, sourceFile) {
      const gallery = document.getElementById('gallery');
      document.getElementById('modelsSection').style.display = '';
      const mats = createMaterials();
      const box = createBoxFunction();
      const builder = loadedModels[sourceFile] && loadedModels[sourceFile].builder;

      for (let idx = 0; idx < config.length; idx++) {

        const modelId = sourceFile + '-' + (cfg.type || 'item') + '-' + idx;

        addedModelIds.add(modelId);

        document.getElementById('modelCount').textContent = modelTotal + ' items';

        card.className = 'model-card';
        card.setAttribute('data-model-id', modelId);

        thumbWrap.appendChild(thumbCanvas);

        info.className = 'mc-info';
        const nameEl = document.createElement('div');
        nameEl.className = 'mc-name';
        nameEl.textContent = cfg.type || 'item';
        const metaEl = document.createElement('div');

        info.appendChild(nameEl);
        info.appendChild(metaEl);

        card.appendChild(info);
        gallery.appendChild(card);

          try {
            const renderCanvas = document.createElement('canvas');
            renderCanvas.width = 320; renderCanvas.height = 200;
            renderTrisToCanvas(cfg.tris, renderCanvas);
            thumbCanvas.width = 56; thumbCanvas.height = 56;
            const tctx = thumbCanvas.getContext('2d');
            tctx.imageSmoothingEnabled = false;
            tctx.drawImage(renderCanvas, 0, 0, 56, 56);
            card.addEventListener('click', () => {
              const grp = trisToThreeGroup(cfg.tris);
              selectModel(modelId, { grp }, nameEl.textContent);
            });
          } catch (e) { console.warn('[tri-thumb]', modelId, e); }
        } else if (builder) {
          try {
            const modelData = builder(cfg.type, { M: mats.M, MB: mats.MB, box });
            if (modelData && modelData.grp) {
              try { renderThumbToCanvas(modelData, thumbCanvas); } catch (e2) { console.warn('[thumb]', modelId, e2); }

    function mkViewerEntity(overrides) {
      const defaults = {
        state: 'idle', stateTimer: 0, facing: 1, charIndex: 0, jumpY: 0,
        hp: 100, maxHp: 100, damage: 42, animFrame: 2, superActive: false,
        _superPhase: 0, _superDShowA: false, _superDWiggle: 0,
        chargeActive: false, x: 400, y: 200, z: 0, worldX: 0, worldZ: 400,
        isAirborne: false, type: 'player', idx: 0, id: 'viewer', dead: false,
        attackTimer: 0, dashTimer: 0, hitFlash: 0, vx: 1.5, vy: 0, stocks: 3,
        animTimer: 0
      };
      const base = Object.assign({}, defaults, overrides || {});
      return new Proxy(base, {
        get(t, k) {
          if (k === Symbol.toPrimitive) return () => 0;
          if (k === 'toString') return () => '';
          if (k in t) return t[k];
          return 0;
        }
      });
    }

    function mkDrawArgs(paramList, ctx, opts) {
      opts = opts || {};
      const genericMock = mkMock();
      const mockEntity = opts.entity || mkViewerEntity();
      const canvasW = opts.canvasW || 800;
      const canvasH = opts.canvasH || 450;
      if (!paramList || paramList.length === 0) return [ctx, mockEntity, 0];
      return paramList.map(p => {
        if (/^(ctx|c|context|canvas|gfx|gc|rd|drawCtx)$/.test(p)) return ctx;
        if (p === 'isLocal' || p === 'isHost') return true;
        if (typeof p === 'string' && /^[A-Z][A-Z_]+$/.test(p)) return 64;
        if (/^(x|y|cx|cy|sx|sy|px|py|tx|ty|topY|offsetX|offsetY|dx|dy|dw|dh|ox|oy)$/i.test(p)) return 0;
        if (/^(w|h|W|H|S|sw|sh|width|height|size)$/i.test(p)) return p === p.toUpperCase() ? canvasW : 16;
        if (/^(frame|fi|animFrame|tick|dt|delta|frameCount)$/i.test(p)) return 0;
        if (/^(animTime|time|t)$/i.test(p)) return 0.5;
        if (/^(screenScale|scale)$/i.test(p)) return 1;
        if (/^(facingRight|facing)$/i.test(p)) return 1;
        if (/^(name|label|text|str|msg)$/i.test(p)) return 'test';
        if (/^(color|colour|fill|stroke)$/i.test(p)) return '#ff0000';
        if (/^(localId|id|key)$/i.test(p)) return 'viewer';
        if (/^(players|ents|entities|list|items|arr|array)$/i.test(p)) {
          return { viewer: mockEntity };
        }
        if (/^(portals|cooldowns|options|config|settings)$/i.test(p)) return genericMock;
        if (p === 'state') return 'idle';
        if (typeof p === 'string' && p.length <= 3) return mockEntity;
        return mockEntity;
      });
    }

    function renderCurrent2D() {
      if (!current2D) return;
      const c2d = document.getElementById('viewer2D');
      const container = document.getElementById('viewport');
      const zoom = parseFloat(document.getElementById('scaleSlider').value);
      c2d.width = container.clientWidth;
      c2d.height = container.clientHeight;
      const ctx = c2d.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, c2d.width, c2d.height);

      if (current2D.texture) {
        const img = current2D.texture.image;
        const base = Math.min(c2d.width / img.width, c2d.height / img.height) * 0.8;
        const w = img.width * base * zoom, h = img.height * base * zoom;
        ctx.drawImage(img, (c2d.width - w) / 2, (c2d.height - h) / 2, w, h);
      } else if (current2D.drawFn) {
        ctx.save();
        const pList = current2D.paramList;
        if (!pList || pList.length <= 1) {
          const canvasW = 800, canvasH = 450;
          const scale = Math.min(c2d.width / canvasW, c2d.height / canvasH) * zoom;
          ctx.translate((c2d.width - canvasW * scale) / 2, (c2d.height - canvasH * scale) / 2);
          ctx.scale(scale, scale);
        } else {
          ctx.translate(c2d.width / 2, c2d.height / 2);
          const scale = Math.min(c2d.width, c2d.height) * 0.5 / 20 * zoom;
          ctx.scale(scale, scale);
        }
        try {
          const pList = current2D.paramList;
          if (pList && pList.length > 0) {
            const genericMock = mkMock();
            const entityDefaults = {
              state: 'idle', stateTimer: 0, facing: 1, charIndex: 0, jumpY: 0,
              hp: 100, maxHp: 100, phase: 0, animFrame: 0, superActive: false,
              _superPhase: 0, _superDShowA: false, _superDWiggle: 0,
              chargeActive: false, x: 0, z: 0, worldX: 0, worldZ: 400,
              isAirborne: false, type: 'player',
            };
            const mockEntity = new Proxy(entityDefaults, {
              get(t, k) {
                if (k === Symbol.toPrimitive) return () => 0;
                if (k === 'toString') return () => '';
                if (k in t) return t[k];
                return 0;
              }
            });
            const args = pList.map(p => {
              if (/^(ctx|c|context|canvas|gfx|gc|rd|drawCtx)$/.test(p)) return ctx;
              if (p === 'isLocal' || p === 'isHost') return true;
              if (typeof p === 'string' && /^[A-Z][A-Z_]+$/.test(p)) return 64;
              if (/^(x|y|cx|cy|sx|sy|px|py|tx|ty|topY|offsetX|offsetY|dx|dy|dw|dh|ox|oy)$/i.test(p)) return 0;
              if (/^(w|h|W|H|S|sw|sh|width|height|size)$/i.test(p)) return p === p.toUpperCase() ? c2d.width : 16;
              if (/^(frame|fi|animFrame|tick|dt|delta|frameCount)$/i.test(p)) return 0;
              if (/^(animTime|time|t)$/i.test(p)) return 0.5;
              if (/^(screenScale|scale)$/i.test(p)) return 1;
              if (/^(facingRight|facing)$/i.test(p)) return 1;
              if (/^(name|label|text|str|msg)$/i.test(p)) return 'test';
              if (/^(color|colour|fill|stroke)$/i.test(p)) return '#ff0000';
              if (/^(localId|id|key)$/i.test(p)) return 'viewer';
              if (/^(portals|cooldowns|options|config|settings)$/i.test(p)) return genericMock;
              if (p === 'state') return 'idle';
              if (typeof p === 'string' && p.length <= 3) return mockEntity;
              return mockEntity;
            });
            current2D.drawFn(...args);
          } else if (current2D.isObstacle) {
            current2D.drawFn(ctx, current2D.entity, 0, 0, 0);
          } else if (current2D.look) {
            current2D.drawFn(ctx, current2D.entity, 0, current2D.look);
          } else {
            current2D.drawFn(ctx, current2D.entity, 0);
          }
        } catch (e) { console.warn('[sprite-render] Draw failed', current2D.name, e); }
        ctx.restore();
      } else if (current2D.effectFn) {
        const ew = c2d.width * 0.8, eh = c2d.height * 0.8;
        const ex = (c2d.width - ew) / 2, ey = (c2d.height - eh) / 2;
        ctx.save();
        try {
          const fnLen = current2D.effectFn.length;
          if (fnLen <= 3) {
            current2D.effectFn(ctx, ew * zoom, eh * zoom, tlTime);
          } else {
            current2D.effectFn(ctx, 'Effect', ex, ey, tlTime, 'center');
          }
        } catch (e) { console.warn('[effect-render] Draw failed', current2D.name, e); }
        ctx.restore();
      }
    }

      title.textContent = label + ' (' + getCatalogSize(data) + ')';
      const body = document.createElement('div');
      body.className = 'catalog-group-body';
      body.style.display = 'none';
      title.addEventListener('click', () => {
        body.style.display = body.style.display === 'none' ? '' : 'none';
      });

        renderCatalogEntries(body, data);

        const row = document.createElement('div');

            const imgData = imgCtx.getImageData(0, 0, tex.image.width, tex.image.height);
            const hex = [];
            for (let i = 0; i < imgData.data.length; i += 4) {
              const r = imgData.data[i], g = imgData.data[i+1], b = imgData.data[i+2], a = imgData.data[i+3];

            code += '// palette (' + unique.length + ' colors):\n';
            unique.forEach(c => { code += '  ' + c + '\n'; });
            code += '\n';

          if (srcMod && moduleSources[srcMod + '.js']) {

              const fnMatch = modSrc.match(fnRe);

                let depth = 0, end = start + 1;
                for (let ci = start + 1; ci < modSrc.length && ci < start + 5000; ci++) {
                  if (modSrc[ci] === '{') depth++;
                  else if (modSrc[ci] === '}') { depth--; if (depth <= 0) { end = ci + 1; break; } }
                }
                code += '// generation source:\n' + modSrc.substring(start + 1, end);
              } else {
                code += '// generation source not found in ' + srcMod + '.js';

          code += '// not loaded';

      } else if (section === 'SPRITES' || section === 'SCENES') {

    const mkMock = () => new Proxy(function(){}, { get(t, k) { if (k === Symbol.toPrimitive) return () => 0; if (k === Symbol.iterator) return function* () { yield mkMock(); yield mkMock(); yield mkMock(); yield mkMock(); }; if (k === 'toString') return () => ''; if (k === 'length') return 0; if (typeof k === 'symbol') return undefined; return mkMock(); }, apply() { return mkMock(); }, has() { return true; } });

          const depRawRefs = (dInfo.body.match(/this\.(\w+)/g) || []).map(r => r.replace('this.', ''));
          for (const ref of depRawRefs) {
            if (!ref.startsWith('_draw') && !ref.startsWith('draw')) allNonDrawThisRefs.add(ref);
          }
        }

        const mainThisRefs = [...new Set((innerBody.match(/this\.(\w+)/g) || []).map(r => r.replace('this.', '')))];
        for (const ref of mainThisRefs) {
          if (!ref.startsWith('_draw') && !ref.startsWith('draw')) allNonDrawThisRefs.add(ref);
        }

        for (const ref of allNonDrawThisRefs) {
          if (ref.includes('.') || ref === 'canvas' || ref === 'ctx') continue;
          if (STUB_RETURNS[ref]) {
            preamble += 'const ' + ref + ' = ' + STUB_RETURNS[ref] + ';\n';
          } else if (RENDERER_NUM_DEFAULTS[ref] !== undefined) {
            preamble += 'const ' + ref + ' = ' + RENDERER_NUM_DEFAULTS[ref] + ';\n';
          } else if (/^_/.test(ref)) {
            preamble += 'const ' + ref + ' = null;\n';
          } else {
            preamble += 'const ' + ref + ' = 0;\n';
          }
        }

        const cleaned = innerBody.replace(/this\./g, '');

        const paramList = (info.sig || '').split(',').map(p => p.trim().split('=')[0].trim()).filter(p => p.length > 0);
        const entityParam = paramList.length >= 2 ? paramList[1] : null;
        const extraParams = paramList.slice(2);

        const BUILTINS = new Set(['Math','PI','sin','cos','floor','ceil','round','min','max','sqrt','abs','atan2','sign','pow','random','parseInt','parseFloat','Number','String','Boolean','Date','Map','Set','Array','Object','JSON','console','window','document','undefined','null','true','false','NaN','Infinity','isFinite','isNaN','requestAnimationFrame','cancelAnimationFrame','setTimeout','setInterval','clearInterval','clearTimeout','addEventListener','removeEventListener','fillRect','strokeRect','beginPath','closePath','moveTo','lineTo','arc','ellipse','quadraticCurveTo','bezierCurveTo','fill','stroke','clip','rect','save','restore','translate','scale','rotate','setTransform','resetTransform','clearRect','fillText','strokeText','drawImage','measureText','createLinearGradient','createRadialGradient','roundRect','drawFocusIfNeeded','values','keys','entries','sort','push','pop','slice','map','filter','forEach','includes','indexOf','join','length']);
        const JSDOC_WORDS = new Set(['param','returns','type','throws','typedef','callback','enum','template','abstract','access','async','augments','class','constant','constructor','default','description','event','example','export','extends','external','fires','function','generator','global','hideconstructor','ignore','inner','instance','interface','kind','listens','member','memberof','method','mixes','module','name','namespace','param','private','property','protected','public','readonly','returns','see','since','static','summary','tutorial','type','typedef','variation','version','yields']);
        const alreadyDefined = new Set(paramList);
        for (const dName of Object.keys(allMethods)) alreadyDefined.add(dName);
        for (const ref of allNonDrawThisRefs) alreadyDefined.add(ref);
        alreadyDefined.add('ctx'); alreadyDefined.add('this');
        // Free vars from THIS body (+ included deps in preamble), not every draw* in the file
        const allBodyText = cleaned + ' ' + preamble;
        const allIdentifiers = [...new Set(allBodyText.match(/\b[A-Z_][a-zA-Z0-9_]*\b/g) || [])];
        // Skip property names (p.idx, state.particles) — only bare identifiers need hoisting
        const lowerIdentifiers = [...new Set((allBodyText.match(/(?<!\.)\b[a-z][a-zA-Z0-9_]*\b/g) || []).filter(id => !BUILTINS.has(id) && !JSDOC_WORDS.has(id) && !alreadyDefined.has(id) && !/^_[a-z]/.test(id) && id.length > 1))];
        const UPPER = allIdentifiers.filter(id => !BUILTINS.has(id) && !alreadyDefined.has(id));
        const moduleRefs = [...new Set([...UPPER, ...lowerIdentifiers])];
        for (const ref of moduleRefs) {
          if (alreadyDefined.has(ref)) continue;
          if (new RegExp('\\b(const|let|var|function)\\s+' + ref + '\\b').test(cleaned)) continue;
          if (importCache[ref] !== undefined) {
            preamble += 'const ' + ref + ' = importCache[' + JSON.stringify(ref) + '];\n';
            alreadyDefined.add(ref);
          } else {
            const decl = extractTopLevelDecl(rendererSource, ref);
            if (decl) {
              preamble += decl + (decl.endsWith(';') || decl.endsWith('}') ? '' : ';') + '\n';
              for (const bn of declBindingNames(decl)) alreadyDefined.add(bn);
            }
          }
        }
        for (const [name, val] of Object.entries(importCache)) {
          if (typeof val === 'number' && !alreadyDefined.has(name) && cleaned.includes(name)) {
            preamble += 'const ' + name + ' = importCache[' + JSON.stringify(name) + '];\n';
            alreadyDefined.add(name);
          }
        }

        const allBodyText2 = cleaned + ' ' + preamble;
        if (!alreadyDefined.has('_loadImg') && allBodyText2.includes('_loadImg')) {
          if (!alreadyDefined.has('_IMG_CACHE')) {
            preamble += 'const _IMG_CACHE = {};\n';
            alreadyDefined.add('_IMG_CACHE');
          }
          preamble += 'const _loadImg = function(url) { if (_IMG_CACHE[url]) return _IMG_CACHE[url]; try { const img = new Image(); img.crossOrigin = "anonymous"; img.src = url; _IMG_CACHE[url] = img; return img; } catch(e) { return { complete: false, naturalWidth: 0 }; } };\n';
          alreadyDefined.add('_loadImg');
        }
        if (!alreadyDefined.has('ASSET') && allBodyText2.includes('ASSET')) {
          preamble += 'const ASSET = new Proxy({}, { get: function(t, k) { return ""; } });\n';
          alreadyDefined.add('ASSET');
        }

        const entityPat = entityParam ? new RegExp('\\b' + entityParam + '\\.(\\w+)', 'g') : null;
        const propAccesses = [...new Set(entityPat ? [...cleaned.matchAll(entityPat)].map(m => m[1]) : [])];
        const mockEntity = mkMock();

        try {
          const wp = (i) => '__p' + i;
          const wParams = paramList.map((_, i) => wp(i));
          const aliasDecl = paramList.map((p, i) => p + ' = ' + wp(i)).join(', ');
          const extraDefaults = extraParams.map((p, i) => {
            const wi = i + 2;
            return 'if (' + wp(wi) + ' === undefined) ' + wp(wi) + ' = null;';
          }).join('\n');
          const bodyPrefix = 'const ' + aliasDecl + ';\n' + (extraDefaults ? extraDefaults + '\n' : '');

          const fnBody = preamble + bodyPrefix + cleaned;
          const wrapper = new Function(...wParams, fnBody);
          console.log('[scenes]', name, '(params:', paramList.join(', ') + ') in', groupPrefix);
          loadedScenes[key] = {
            drawers: { default: { sprite: wrapper } },
            name: shortName,
            source: groupPrefix + '.js',
            isObstacle: false,
            _mockEntity: mockEntity,
            _extractedFrom: name,
            _paramList: paramList
          };
        } catch (err) {
          console.warn('[scenes] Failed to wrap', name, err);
        }
      }
      if (Object.keys(loadedScenes).length > 0) {
        populateSceneList();
      }
    }

    function extractClassDrawers() {
      const DRAW_CTX = /^(ctx|c|context|canvas|g|gfx|gc|rd|renderCtx|renderContext|drawCtx)$/;
      const DEFAULT_EP = { body: '#4a8f3f', bodyDark: '#2d5a27', bodyLight: '#72c264', eye: '#ffffff', accent: '#c0392b' };
      const seenClasses = new Set();
      for (const key of Object.keys(importCache)) {
        const val = importCache[key];
        if (typeof val !== 'function') continue;
        if (!val.prototype) continue;
        if (seenClasses.has(val)) continue;
        seenClasses.add(val);

        // Skip UI menus, game engine managers, effect classes, and the main renderer class (already extracted in Phase 4)
        if (lastRendererMethodName && key.toLowerCase() === lastRendererMethodName.toLowerCase()) continue;
        if (/Menu|Screen|Select|Overlay|Bridge|Factory|Handler|Game|Input|Effect|Particle|Vfx|Item|Prop|Player|Enemy|Boss/i.test(key)) continue;

        const proto = val.prototype;
        const methodNames = Object.getOwnPropertyNames(proto).filter(n => {
          if (n === 'constructor') return false;
          if (!n.startsWith('_draw') && !n.startsWith('draw')) return false;
          if (typeof proto[n] !== 'function') return false;
          const sig = proto[n].toString().match(/\(([^)]*)\)/);
          if (!sig) return false;
          const params = sig[1].split(',').map(p => p.trim().split(/\s+as\s+/)[0].trim()).filter(p => p.length > 0);
          return params.length >= 1 && DRAW_CTX.test(params[0]);
        });
        if (methodNames.length === 0) continue;

        let instance;
        try {
          const classMockCanvas = { width: 320, height: 200, addEventListener() {} };
          const mockCtx = { save() {}, restore() {}, translate() {}, scale() {}, rotate() {},
            beginPath() {}, closePath() {}, moveTo() {}, lineTo() {}, quadraticCurveTo() {},
            arc() {}, ellipse() {}, fillRect() {}, strokeRect() {}, fill() {}, stroke() {},
            createLinearGradient() { return { addColorStop() {} }; },
            createRadialGradient() { return { addColorStop() {} }; },
            measureText(t) { return { width: t.length * 6 }; },
            fillText() {}, strokeText() {}, drawImage() {}, clip() {}, rect() {},
            setTransform() {}, resetTransform() {}, clearRect() {},
            createImageData(w, h) { return { data: new Uint8ClampedArray(w * h * 4), width: w, height: h }; },
            getImageData() { return { data: new Uint8ClampedArray(0), width: 0, height: 0 }; },
            putImageData() {}, setLineDash() {}, getLineDash() { return []; }, isPointInPath() { return false; },
            set fillStyle(v) {}, set strokeStyle(v) {}, set lineWidth(v) {},
            set globalAlpha(v) {}, set font(v) {}, set textAlign(v) {},
            set textBaseline(v) {}, set lineCap(v) {}, set lineJoin(v) {}, set miterLimit(v) {},
            set lineDashOffset(v) {},
            set shadowColor(v) {}, set shadowBlur(v) {}, set shadowOffsetX(v) {}, set shadowOffsetY(v) {},
            get fillStyle() { return '#000'; }, get strokeStyle() { return '#000'; },
            get lineWidth() { return 1; }, get globalAlpha() { return 1; },
            canvas: classMockCanvas
          };
          classMockCanvas.getContext = function() { return mockCtx; };
          const mockCanvas = classMockCanvas;
          const ctorStr = val.toString();
          const ctorParams = (ctorStr.match(/\(([^)]*)\)/) || ['', ''])[1].split(',').map(s => s.trim()).filter(s => s);
          const ctorLen = ctorParams.length;
          try {
            if (ctorLen <= 1) { try { instance = new val(mockCanvas); } catch(e) { instance = new val(mockCtx); } }
            else if (ctorLen === 2) instance = new val(mockCtx, mockCanvas);
            else instance = new val(mockCtx, mockCanvas, {});
          } catch (e1) {
            try { instance = new val(); } catch (e2) {
              try { instance = new val({}); } catch (e3) {
                try { instance = new val(mockCtx, {}, mockCanvas); } catch (e4) {
                  console.warn('[class-draw] Could not instantiate', key, ctorLen, 'ctor params:', ctorParams);
                  continue;
                }
              }
            }
          }
        } catch (e) {
          console.warn('[class-draw] Could not instantiate', key, e);
          continue;
        }
        // Wrap instance in safety proxy: missing properties → recursive mock (handles this.bindings.get etc.)
        const rawInstance = instance;
        instance = new Proxy(rawInstance, {
          get(t, prop, receiver) {
            const val = Reflect.get(t, prop, receiver);
            if (val !== undefined) {
              if (typeof val === 'object' && val !== null && !Array.isArray(val) && typeof val.then !== 'function' && typeof val.getBoundingClientRect !== 'function') {
                return new Proxy(val, { get(t2, p2) { const v2 = Reflect.get(t2, p2); return v2 !== undefined ? v2 : mkMock(); } });
              }
              return val;
            }
            if (typeof prop === 'symbol') return undefined;
            return mkMock();
          }
        });

        for (const m of methodNames) {
          const shortName = m.replace(/^_?draw/, '').toLowerCase() || m;
          const spriteKey = key.toLowerCase() + ':' + shortName;
          if (loadedSprites[spriteKey]) continue;
          try {
            const raw = proto[m];
            const sig = raw.toString().match(/\(([^)]*)\)/);
            const params = sig ? sig[1].split(',').map(p => p.trim().split(/\s+as\s+/)[0].trim()).filter(p => p.length > 0) : [];
            const hasCXCY = params.length >= 3 && (params[1] === 'cx' || params[1] === 'x') && (params[2] === 'cy' || params[2] === 'y');
            const hasEP = params.some(p => p === 'ep' || p === 'pal' || p === 'palette');
            const hasFrame = params.some(p => p === 'frame' || p === 'fi' || p === 'animFrame');

            let wrapper;
            if (hasCXCY) {
              wrapper = function(ctx, e, frame) {
                raw.call(instance, ctx, 160, 100, e, frame || 0, hasEP ? DEFAULT_EP : undefined);
              };
            } else {
              // Build full arg list matching the method's param names
              wrapper = function(ctx, e, frame) {
                const ARG_DEFAULTS = {
                  ctx: ctx, c: ctx, context: ctx, gfx: ctx, gc: ctx, rd: ctx, drawCtx: ctx,
                  ent: e, entity: e, p: e, player: e, pr: e, prop: e, h: e, hitEffect: e,
                  ch: e, chest: e, sp: e, spawner: e, portal: e, d: e, drop: e,
                  vfx: e, proj: e, projectile: e, dn: e, damageNumber: e,
                  dx: 160, x: 160, cx: 160, sx: 160,
                  dy: 100, y: 100, cy: 100, sy: 100,
                  sw: 80, w: 80, width: 80,
                  sh: 80, h: 80, height: 80,
                  frameCount: frame || 0, frame: frame || 0, fi: frame || 0, animFrame: frame || 0, tick: frame || 0, t: frame || 0,
                  screenScale: 1, scale: 1,
                  facingRight: true, facing: 1,
                  isLocal: true, isHost: true,
                  localId: 'viewer', id: 'viewer', key: 'viewer',
                  W: 640, H: 448,
                  state: 'idle', palette: mkMock(), ep: mkMock(), pal: mkMock(),
                };
                const args = params.map(p => ARG_DEFAULTS[p] !== undefined ? ARG_DEFAULTS[p] : (typeof p === 'string' && /^[A-Z][A-Z_]+$/.test(p) ? 64 : mkMock()));
                return raw.apply(instance, args);
              };
            }
            loadedSprites[spriteKey] = {
              drawers: { default: { sprite: wrapper } },
              name: shortName,
              source: key + '.js (class)',
              isObstacle: false
            };
          } catch (e) { console.warn('[class-draw] bind failed', m, e); }
        }
      }
      if (Object.keys(loadedSprites).length > 0) {
        populateSpriteList();
      }
    }

    function extractTexCallback(source, key) {
      const patterns = ['T.' + key + ' = tex(', 'T["' + key + '"] = tex('];
      let start = -1;
      for (const p of patterns) { start = source.indexOf(p); if (start !== -1) break; }
      if (start === -1) return null;
      const arrowStart = source.indexOf('=>', start);
      if (arrowStart === -1) return null;
      const bodyStart = source.indexOf('{', arrowStart);
      if (bodyStart === -1) return null;
      let depth = 0;
      for (let i = bodyStart; i < source.length; i++) {
        if (source[i] === '{') depth++;
        else if (source[i] === '}') {
          depth--;
          if (depth === 0) return source.slice(bodyStart, i + 1);
        }
      }
      return null;
    }

    // ===== TABS =====
    const tabs = document.querySelectorAll('.tab');
    const tabContents = document.querySelectorAll('.tab-content');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add('active');
        if (tab.dataset.tab === 'code') buildCodePalette();
        if (tab.dataset.tab === 'visual' && mainRenderer) {
          const container = document.getElementById('viewport');
          mainRenderer.setSize(container.clientWidth, container.clientHeight);
          mainCamera.aspect = container.clientWidth / container.clientHeight;
          mainCamera.updateProjectionMatrix();
        }
      });
    });

    // ===== CONTROLS =====
    document.getElementById('scaleSlider').addEventListener('input', e => {
      const s = parseFloat(e.target.value);
      document.getElementById('scaleVal').textContent = s.toFixed(1) + 'x';
      if (viewMode === 'sprite' || viewMode === 'texture') {
        renderCurrent2D();
      } else {
        mainModelGroup.scale.set(s, s, s);
      }
    });
    document.getElementById('resetView').addEventListener('click', resetView);

    // ===== COLLAPSE PALETTE TITLES =====
    document.querySelectorAll('.palette-title').forEach(title => {
      title.addEventListener('click', () => {
        title.closest('.palette-section').classList.toggle('collapsed');
      });
    });

    // ===== INIT =====
    window.addEventListener('load', () => {
      initMainViewport();
      animate();
      autoPreload();
    });
  </script>
